name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        
      - name: Check formatting
        run: cargo fmt --all -- --check
        
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        
      - name: Run tests
        run: cargo test --all --verbose

      - name: Run examples
        run: |
          cargo run --example schaffer_optimization
          cargo run --example zdt1_optimization
          cargo run --example custom_problem
          cargo run --example constrained_problem
          cargo run --example early_stopping
          cargo run --example metrics_tracking